services:
  front:
    build:
      context: .
      dockerfile: dockerfile
    container_name: paul-site
    restart: unless-stopped
    ports:
      - "8080:80" # Adapter si nécessaire
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
