server {
    listen 80;
    server_name localhost;

    # Ne pas exposer la version de Nginx
    server_tokens off;

    # Compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité communs
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP stricte désactivée pour l'instant (à activer après vérification des sources inline/externes).
    # Proposition :
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

    # Assets fingerprintés : cache long et immuable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html : jamais mis en cache pour garantir les mises à jour
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Routage SPA
    location / {
        try_files $uri /index.html;
    }

    # Logs vers la sortie standard du conteneur
    error_log /dev/stderr;
    access_log /dev/stdout;
}
